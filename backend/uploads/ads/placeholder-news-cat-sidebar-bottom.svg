<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="imgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="infoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#1e3160"/>
    </linearGradient>
  </defs>
  <!-- Image preview area -->
  <rect width="300" height="260" fill="url(#imgGrad)" rx="0"/>
  <!-- Camera icon circle -->
  <circle cx="150" cy="130" r="35" fill="rgba(255,255,255,0.12)"/>
  <circle cx="150" cy="130" r="29" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5"/>
  <circle cx="150" cy="130" r="14" fill="rgba(255,255,255,0.55)"/>
  <!-- Dashed overlay frame -->
  <rect x="6" y="6" width="288" height="252" fill="none" stroke="rgba(255,255,255,0.25)" stroke-dasharray="5 5" rx="6" stroke-width="1.5"/>
  <!-- Size label in image area -->
  <text x="150" y="248" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">300 × 400</text>
  <!-- Info strip -->
  <rect y="260" width="300" height="140" fill="url(#infoGrad)"/>
  <rect y="260" width="300" height="1.5" fill="#a855f7" opacity="0.7"/>
  <!-- Ad label -->
  <text x="150" y="313" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">NEWS CAT SIDEBAR BOTTOM</text>
  <text x="150" y="361" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.55)" text-anchor="middle">ADVERTISEMENT</text>
</svg>